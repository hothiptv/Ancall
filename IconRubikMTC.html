<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Icon rubik</title>
<style>
:root{--bg:#f3f4f6;--fg:#15171a;--card:#fff;--line:#d5d9df;--ac:#2563eb;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--fg:#eceef1;--card:#1c1e22;--line:#34373e;--ac:#6b9bff;--mut:#9aa1ad}}
:root[data-theme="dark"]{--bg:#111214;--fg:#eceef1;--card:#1c1e22;--line:#34373e;--ac:#6b9bff;--mut:#9aa1ad}
html,body{margin:0;height:auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:4px 0 12px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
#ed{width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;display:block;background:#fff;border:1px solid var(--line);touch-action:none}
#ed.editing{outline:3px dashed var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
input{font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
#hint{margin:0;font-size:13px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;box-sizing:border-box}
.mbox{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:10px;max-width:100%;max-height:100%;box-sizing:border-box}
.mh{display:flex;justify-content:space-between;align-items:center}
#pv{width:min(100%,calc(100vh - 190px),560px);aspect-ratio:1;margin:0 auto;display:block;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>🧊 Icon rubik</h1>
<div class="tabs"><button data-m="f2l" class="on">F2L</button><button data-m="oll">OLL</button><button data-m="pll">PLL</button></div>
<div class="panel">
<canvas id="ed" width="720" height="720"></canvas>
<div class="row" id="rowEdit" hidden><button id="btnEdit">Chỉnh sửa</button><button id="btnClear">Xoá hết</button></div>
<div class="row" id="rowSide"><button data-s="R" class="on">Khối nghiêng phải</button><button data-s="L">Khối nghiêng trái</button></div>
<p id="hint"></p>
<label>Tên công thức<input id="name" placeholder="Ví dụ: F2L số 1" autocomplete="off"></label>
<label><span id="lbSetup">Setup</span><input id="setup" placeholder="R U R’ U’" autocomplete="off" autocapitalize="off"></label>
<label>Công thức giải<input id="sol" placeholder="R U R’ U’" autocomplete="off" autocapitalize="off"></label>
<div class="row"><button id="btnPrev">Xem trước thẻ</button><button id="btnDl" class="pri">Tải ảnh về</button></div>
</div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mh"><b>Xem trước thẻ</b><button id="mClose">Đóng</button></div><canvas id="pv" width="1000" height="1000"></canvas><button id="mDl" class="pri">Tải ảnh về</button></div></div>
<script>
const $=id=>document.getElementById(id);
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COL={U:"#f5d90a",D:"#f2f2f2",F:"#1e5bd8",B:"#1f9d55",R:"#d92b2b",L:"#f58a1f"};
const st={f2l:{name:"F2L 1",setup:"R U R’",sol:"R U’ R’",side:"R"},oll:{name:"",setup:"",sol:"",cells:Array(21).fill(false)},pll:{name:"",setup:"",sol:"",arrows:[]}};
st.oll.cells[4]=true;
let mode="f2l",edit=false,sel=null,dbl=false;

/* ---------- cube logic ---------- */
function solved(){const s=[];for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
 if(x==1)s.push({p:[x,y,z],n:[1,0,0],c:"R"});if(x==-1)s.push({p:[x,y,z],n:[-1,0,0],c:"L"});
 if(y==1)s.push({p:[x,y,z],n:[0,1,0],c:"U"});if(y==-1)s.push({p:[x,y,z],n:[0,-1,0],c:"D"});
 if(z==1)s.push({p:[x,y,z],n:[0,0,1],c:"F"});if(z==-1)s.push({p:[x,y,z],n:[0,0,-1],c:"B"});}return s}
function rot(v,a,k){k=((k%4)+4)%4;let [x,y,z]=v;for(let i=0;i<k;i++){if(a==0)[y,z]=[-z,y];else if(a==1)[x,z]=[z,-x];else [x,y]=[-y,x];}return [x,y,z]}
const FACE={R:[0,1,-1],L:[0,-1,1],U:[1,1,-1],D:[1,-1,1],F:[2,1,-1],B:[2,-1,1]};
function move(S,ch,t){const up=ch.toUpperCase(),wide=ch!==up&&"UDLRFB".includes(up);let ax,lay,k,ok;
 if("xyz".includes(ch)){ax="xyz".indexOf(ch);k=-1;ok=()=>true}
 else if(up=="M"){ax=0;k=1;ok=v=>v==0}else if(up=="E"){ax=1;k=1;ok=v=>v==0}else if(up=="S"){ax=2;k=-1;ok=v=>v==0}
 else{[ax,lay,k]=FACE[up];ok=v=>wide?(v==lay||v==0):v==lay}
 for(const s of S)if(ok(s.p[ax])){s.p=rot(s.p,ax,k*t);s.n=rot(s.n,ax,k*t)}}
function applyAlg(S,alg){alg=String(alg).replace(/([UDLRFB])w/g,(a,b)=>b.toLowerCase());const re=/([UDLRFBudlrfbxyzMES])\s*(2)?\s*(['’′]?)/g;let m;
 while((m=re.exec(alg))){let t=m[2]?2:1;if(m[3])t=-t;move(S,m[1],t)}}
function drawCube(c,S,cx,cy,sc,side){
 const th=(side=="R"?-1:1)*35*Math.PI/180,ph=28*Math.PI/180;
 const prj=v=>{const [x,y,z]=v;const x1=x*Math.cos(th)+z*Math.sin(th),z1=-x*Math.sin(th)+z*Math.cos(th);
  return [x1,y*Math.cos(ph)-z1*Math.sin(ph),y*Math.sin(ph)+z1*Math.cos(ph)]};
 const vis=S.filter(s=>prj(s.n)[2]>0.01);
 const quad=(s,h)=>{const n=s.n,q=[0,1,2].map(i=>s.p[i]+n[i]*.5),ax=[0,1,2].filter(i=>n[i]==0);
  const t1=[0,0,0],t2=[0,0,0];t1[ax[0]]=1;t2[ax[1]]=1;
  return [[1,1],[1,-1],[-1,-1],[-1,1]].map(([a,b])=>{const P=prj(q.map((v,i)=>v+h*(a*t1[i]+b*t2[i])));return [cx+P[0]*sc,cy-P[1]*sc]})};
 c.lineJoin="round";
 for(const [h,fill] of [[.5,"#111"],[.43,null]])for(const s of vis){const Q=quad(s,h);c.beginPath();Q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  c.fillStyle=fill||COL[s.c];c.fill();if(fill){c.strokeStyle="#111";c.lineWidth=sc*.06;c.stroke()}}}

/* ---------- OLL / PLL ---------- */
function ollRects(S){const u=S/3.92,g=.06*u,b=.28*u,o=b+.12*u,R=[];
 for(let r=0;r<3;r++)for(let c=0;c<3;c++)R.push([o+c*(u+g),o+r*(u+g),u,u]);
 for(let c=0;c<3;c++)R.push([o+c*(u+g),0,u,b]);
 for(let r=0;r<3;r++)R.push([S-b,o+r*(u+g),b,u]);
 for(let c=0;c<3;c++)R.push([o+c*(u+g),S-b,u,b]);
 for(let r=0;r<3;r++)R.push([0,o+r*(u+g),b,u]);return R}
function drawOLL(c,S,cells){const R=ollRects(S);c.lineJoin="round";c.lineWidth=Math.max(2,S*.008);c.strokeStyle="#222";
 R.forEach((r,i)=>{c.fillStyle=(i==4||cells[i])?"#f7d716":"#eceff1";c.fillRect(...r);c.strokeRect(...r)})}
function pllRects(S){const u=S*.28,g=S*.03,o=(S-3*u-2*g)/2,R=[];for(let r=0;r<3;r++)for(let k=0;k<3;k++)R.push([o+k*(u+g),o+r*(u+g),u,u]);return R}
function drawPLL(c,S,arrows,sl){const R=pllRects(S),u=R[0][2];c.lineJoin="round";c.lineWidth=Math.max(2,S*.008);c.strokeStyle="#222";
 R.forEach((r,i)=>{c.fillStyle=i===sl?"#bcd4ff":"#fff";c.fillRect(...r);c.strokeRect(...r)});
 const ctr=i=>[R[i][0]+u/2,R[i][1]+u/2],H=u*.3,W=S*.022;
 c.fillStyle=c.strokeStyle="#1b1b1f";c.lineCap="round";
 const head=(tx,ty,dx,dy)=>{const bx=tx-dx*H,by=ty-dy*H,px=-dy*H*.5,py=dx*H*.5;c.beginPath();c.moveTo(tx,ty);c.lineTo(bx+px,by+py);c.lineTo(bx-px,by-py);c.closePath();c.fill()};
 for(const a of arrows){const A=ctr(a.a),B=ctr(a.b);let dx=B[0]-A[0],dy=B[1]-A[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
  const s0=u*.2,s=[A[0]+dx*s0,A[1]+dy*s0],e=[B[0]-dx*s0,B[1]-dy*s0];
  c.lineWidth=W;c.beginPath();c.moveTo(s[0]+(a.d?dx*H*.8:0),s[1]+(a.d?dy*H*.8:0));c.lineTo(e[0]-dx*H*.8,e[1]-dy*H*.8);c.stroke();
  head(e[0],e[1],dx,dy);if(a.d)head(s[0],s[1],-dx,-dy)}}

/* ---------- card ---------- */
function illus(c,m,S,ed){const d=st[m];
 if(m=="f2l"){const C=solved();applyAlg(C,d.setup||"");drawCube(c,C,S/2,S/2,S*.215,d.side)}
 else if(m=="oll")drawOLL(c,S,d.cells);else drawPLL(c,S,d.arrows,ed?sel:null)}
function fit(c,t,w,fs,wt){while(fs>22){c.font=wt+" "+fs+"px "+FONT;if(c.measureText(t).width<=w)break;fs-=2}}
function wrap(c,t,w){const out=[];for(const para of String(t||"").split("\n")){let line="";for(const word of para.split(/\s+/).filter(Boolean)){const tt=line?line+" "+word:word;if(c.measureText(tt).width>w&&line){out.push(line);line=word}else line=tt}out.push(line)}return out}
function drawCard(c,W,m){const d=st[m];c.fillStyle="#fff";c.fillRect(0,0,W,W);c.strokeStyle="#111";c.lineWidth=8;c.strokeRect(4,4,W-8,W-8);
 c.fillStyle="#111";c.textAlign="center";c.textBaseline="middle";
 const nm=d.name.trim()||"Tên công thức";fit(c,nm,W*.88,64,"700");c.fillText(nm,W/2,92);
 const S=470;c.save();c.translate((W-S)/2,165);illus(c,m,S,false);c.restore();
 const x0=80,w=840,lw=200,rows=[["Setup",d.setup.trim()||"—"],["Giải",d.sol.trim()||"—"]];let fs=46,hs,ls;
 for(;fs>=24;fs-=4){c.font="600 "+fs+"px "+FONT;ls=rows.map(r=>wrap(c,r[1],w-lw-40));hs=ls.map(l=>l.length*fs*1.25+26);if(hs[0]+hs[1]<=250)break}
 let y=668;c.textAlign="left";c.lineWidth=3;c.strokeStyle="#111";
 rows.forEach((r,i)=>{const h=hs[i];c.fillStyle="#eee";c.fillRect(x0,y,lw,h);c.strokeRect(x0,y,lw,h);c.strokeRect(x0+lw,y,w-lw,h);
  c.fillStyle="#111";c.font="700 "+fs+"px "+FONT;c.fillText(r[0],x0+20,y+h/2);
  c.font="600 "+fs+"px "+FONT;const n=ls[i].length;ls[i].forEach((t,k)=>c.fillText(t,x0+lw+20,y+h/2+(k-(n-1)/2)*fs*1.25));y+=h});
 c.textAlign="right";c.font="italic 600 34px "+FONT;c.fillStyle="rgba(0,0,0,.2)";c.fillText("Minh Thanh Cube",W-36,W-34)}

/* ---------- UI ---------- */
const ed=$("ed"),ec=ed.getContext("2d");
function render(){ec.fillStyle="#fff";ec.fillRect(0,0,720,720);illus(ec,mode,720,edit);
 if(!$("modal").hidden){const p=$("pv").getContext("2d");drawCard(p,1000,mode)}}
function setHint(){$("hint").textContent=mode=="f2l"?"Khối sẽ xoay theo công thức Setup. Dùng ký hiệu R U F L D B, x y z, r u f l d b, M E S và ’ hoặc 2.":
 !edit?"Bấm “Chỉnh sửa” để vẽ hình. Setup chỉ để ghi chú, khối không xoay.":
 mode=="oll"?"Chạm vào ô hoặc thanh viền để bật/tắt màu vàng (ô tâm luôn vàng).":
 "Chạm ô đầu rồi ô đích để tạo mũi tên. Chạm ô đầu 2 lần rồi ô đích để có mũi tên 2 đầu. Ấn giữ một ô để xoá đường chạm tới ô đó."}
function setMode(m){mode=m;edit=false;sel=null;dbl=false;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m==m));
 $("rowEdit").hidden=m=="f2l";$("rowSide").hidden=m!="f2l";$("btnClear").hidden=m=="f2l";
 $("btnEdit").textContent="Chỉnh sửa";ed.classList.remove("editing");
 $("lbSetup").textContent=m=="f2l"?"Setup (khối xoay theo công thức này)":"Setup (chỉ ghi chú, không xoay)";
 const d=st[m];$("name").value=d.name;$("setup").value=d.setup;$("sol").value=d.sol;
 document.querySelectorAll("#rowSide button").forEach(b=>b.classList.toggle("on",b.dataset.s==st.f2l.side));
 setHint();render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll("#rowSide button").forEach(b=>b.onclick=()=>{st.f2l.side=b.dataset.s;document.querySelectorAll("#rowSide button").forEach(x=>x.classList.toggle("on",x==b));render()});
["name","setup","sol"].forEach(k=>$(k).addEventListener("input",e=>{st[mode][k]=e.target.value;render()}));
$("btnEdit").onclick=()=>{edit=!edit;sel=null;dbl=false;$("btnEdit").textContent=edit?"Xong":"Chỉnh sửa";ed.classList.toggle("editing",edit);setHint();render()};
$("btnClear").onclick=()=>{if(mode=="oll"){st.oll.cells.fill(false);st.oll.cells[4]=true}else st.pll.arrows=[];sel=null;dbl=false;render()};

let lpT=null,lp=false;
function hit(e){const r=ed.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*720/r.height;
 const R=mode=="oll"?ollRects(720):pllRects(720);return R.findIndex(q=>x>=q[0]&&x<=q[0]+q[2]&&y>=q[1]&&y<=q[1]+q[3])}
function tap(i){if(mode=="oll"){if(i<9&&i==4)return;if(i!=4)st.oll.cells[i]=!st.oll.cells[i];return}
 if(sel===null){sel=i;dbl=false}else if(i==sel){if(dbl){sel=null;dbl=false}else dbl=true}
 else{st.pll.arrows.push({a:sel,b:i,d:dbl});sel=null;dbl=false}}
ed.addEventListener("pointerdown",e=>{if(!edit||mode=="f2l")return;e.preventDefault();lp=false;const i=hit(e);if(i<0||mode!="pll")return;
 lpT=setTimeout(()=>{lp=true;const a=st.pll.arrows;for(let k=a.length-1;k>=0;k--)if(a[k].a==i||a[k].b==i){a.splice(k,1);break}sel=null;dbl=false;render()},450)});
ed.addEventListener("pointerup",e=>{clearTimeout(lpT);if(!edit||lp||mode=="f2l")return;const i=hit(e);if(i<0)return;tap(i);render()});
["pointerleave","pointercancel"].forEach(t=>ed.addEventListener(t,()=>clearTimeout(lpT)));
ed.addEventListener("contextmenu",e=>e.preventDefault());

async function dl(){const cv=document.createElement("canvas");cv.width=cv.height=1000;drawCard(cv.getContext("2d"),1000,mode);
 const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
 const fn=((st[mode].name.trim()||mode.toUpperCase()).replace(/[^\p{L}\p{N}_-]+/gu,"_"))+".png";
 try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:fn,data:blob});return}}catch(err){if(err&&err.code=="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
$("btnDl").onclick=$("mDl").onclick=dl;
$("btnPrev").onclick=()=>{$("modal").hidden=false;render()};
$("mClose").onclick=()=>{$("modal").hidden=true};

/* ---------- chống zoom ---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key))e.preventDefault()});
setMode("f2l");
</script>
</body>
</html>
