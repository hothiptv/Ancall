<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minh Thanh Cube IRubik</title>
<style>
:root{--bg:#f3f4f6;--fg:#15171a;--card:#fff;--line:#d5d9df;--ac:#2563eb;--mut:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--fg:#eceef1;--card:#1c1e22;--line:#34373e;--ac:#6b9bff;--mut:#9aa1ad}}
:root[data-theme="dark"]{--bg:#111214;--fg:#eceef1;--card:#1c1e22;--line:#34373e;--ac:#6b9bff;--mut:#9aa1ad}
html,body{margin:0;height:auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:4px 0 12px;text-align:center}
.tabs,.ltabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
#ed{width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;display:block;background:#fff;border:1px solid var(--line);touch-action:none}
#ed.editing{outline:3px dashed var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
input{font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
#hint{margin:0;font-size:13px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;box-sizing:border-box}
.mbox{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:10px;max-width:100%;max-height:100%;box-sizing:border-box}
.mh{display:flex;justify-content:space-between;align-items:center}
#pv{width:min(100%,calc(100vh - 190px),560px);aspect-ratio:1;margin:0 auto;display:block;background:#fff}
#kb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:3fr 1.4fr;gap:6px;z-index:8;max-width:520px;margin:0 auto}
.kl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.k1{background:#d1d5db;color:#111}.kw{background:#fff;color:#111}.kd{background:#5b616b;border-color:#5b616b;color:#fff}
select{font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 8px;width:100%;box-sizing:border-box}
#lm{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;box-sizing:border-box}
#lm .mbox{width:100%;max-width:520px;height:min(86vh,720px);grid-template-rows:auto auto minmax(0,1fr) auto}
#lbody{overflow-y:auto;display:grid;gap:8px;align-content:start}
.fh{display:flex;gap:6px;align-items:center;margin-top:8px}.fh input{flex:1;font-weight:600}
.it{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}.it b{display:block}.it small{color:var(--mut)}
.it .r{display:flex;gap:6px}.it .r>*{flex:1;min-height:40px;min-width:0}.kg{display:grid;grid-template-rows:repeat(4,1fr);gap:6px}#kb button{padding:0;font-size:20px;min-height:46px}.kg button{font-size:15px}.kdel{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
.kbOpen>*{order:3}.kbOpen>label{order:1}.kbOpen>#ed{order:2;max-width:260px}
.lh{font-size:14px;color:var(--mut);margin-top:4px}.li{display:flex;gap:8px;margin-top:6px}.li button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .del{min-width:64px}
</style>
</head>
<body>
<div class="wrap">
<h1 style="margin-bottom:0">🧊 Minh Thanh Cube IRubik</h1>
<div style="text-align:center;font-size:13px;color:var(--mut);margin:2px 0 12px">v1.0</div>
<div class="tabs"><button data-m="f2l" class="on">F2L</button><button data-m="oll">OLL</button><button data-m="pll">PLL</button></div>
<div class="panel" id="pan">
<canvas id="ed" width="720" height="720"></canvas>
<div class="row" id="rowEdit" hidden><button id="btnEdit">Chỉnh sửa</button><button id="btnClear">Xoá hết</button></div>
<div class="row" id="rowSide"><button data-s="R" class="on">Khối nghiêng phải</button><button data-s="L">Khối nghiêng trái</button></div>
<div class="row" id="rowPlay"><button id="bpSetup">▶ Setup</button><button id="bpSol">▶ Giải</button></div>
<p id="hint"></p>
<label>Tên công thức<input id="name" placeholder="Ví dụ: F2L số 1" autocomplete="off"></label>
<label><span id="lbSetup">Setup</span><input id="setup" inputmode="none" placeholder="R U R’ U’" autocomplete="off" autocapitalize="off"></label>
<label>Công thức giải<input id="sol" inputmode="none" placeholder="R U R’ U’" autocomplete="off" autocapitalize="off"></label>
<div class="row"><button id="btnPrev">Xem trước thẻ</button><button id="btnDl" class="pri">Tải ảnh về</button></div>
<select id="saveFolder"></select>
<div class="row"><button id="btnSave">Lưu vào danh sách</button><button id="btnList">Danh sách</button></div>
<div class="row"><button id="btnSaveNew" hidden>Lưu bản mới</button><button id="btnNew">Mới</button></div>
</div>
</div>
<div id="lm" hidden><div class="mbox"><div class="mh"><b>Danh sách công thức</b><div style="display:flex;gap:6px"><button id="lAll">Tải tất cả</button><button id="lClose">Đóng</button></div></div>
<div class="ltabs" id="ltabs"><button data-m="f2l" class="on">F2L</button><button data-m="oll">OLL</button><button data-m="pll">PLL</button></div>
<div id="lbody"></div>
<div class="row"><input id="fname" placeholder="Tên mục mới (tạo trong mục đang mở)" autocomplete="off"><button id="fAdd">+ Tạo mục</button></div></div></div>
<div id="kb" hidden>
<div class="kl"><button data-k="x" class="k1">x</button><button data-k="U" class="kw">U</button><button data-k="y" class="k1">y</button><button data-k="L" class="kw">L</button><button data-k="F" class="k1">F</button><button data-k="R" class="kw">R</button><button data-k="z" class="k1">z</button><button data-k="D" class="kw">D</button><button data-k="B" class="k1">B</button><button data-k="w" class="kd">w</button><button data-k="’" class="kd">’</button><button data-k="2" class="kd">2</button></div>


<div class="kg"><button data-k="del" class="kdel">Xoá</button><button data-k="clr">Xoá tất cả</button><button data-k="paste">Dán</button><button data-k="done" class="pri">Xong</button></div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mh"><b>Xem trước thẻ</b><button id="mClose">Đóng</button></div><canvas id="pv" width="1000" height="1000"></canvas><button id="mDl" class="pri">Tải ảnh về</button></div></div>
<script>
const $=id=>document.getElementById(id);
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COL={U:"#f5d90a",D:"#f2f2f2",F:"#1e5bd8",B:"#1f9d55",R:"#d92b2b",L:"#f58a1f"};
const st={f2l:{name:"F2L 1",setup:"R U R’",sol:"R U’ R’",side:"R"},oll:{name:"",setup:"",sol:"",cells:Array(21).fill(false)},pll:{name:"",setup:"",sol:"",arrows:[]}};
st.oll.cells[4]=true;
let mode="f2l",edit=false,sel=null,dbl=false;

/* ---------- cube logic ---------- */
function solved(){const s=[];for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
 if(x==1)s.push({p:[x,y,z],n:[1,0,0],c:"R"});if(x==-1)s.push({p:[x,y,z],n:[-1,0,0],c:"L"});
 if(y==1)s.push({p:[x,y,z],n:[0,1,0],c:"U"});if(y==-1)s.push({p:[x,y,z],n:[0,-1,0],c:"D"});
 if(z==1)s.push({p:[x,y,z],n:[0,0,1],c:"F"});if(z==-1)s.push({p:[x,y,z],n:[0,0,-1],c:"B"});}s.forEach(q=>{q.t=q.p[1]==1});return s}
function rot(v,a,k){k=((k%4)+4)%4;let [x,y,z]=v;for(let i=0;i<k;i++){if(a==0)[y,z]=[-z,y];else if(a==1)[x,z]=[z,-x];else [x,y]=[-y,x];}return [x,y,z]}
const FACE={R:[0,1,-1],L:[0,-1,1],U:[1,1,-1],D:[1,-1,1],F:[2,1,-1],B:[2,-1,1]};
function move(S,ch,t){const up=ch.toUpperCase(),wide=ch!==up&&"UDLRFB".includes(up);let ax,lay,k,ok;
 if("xyz".includes(ch)){ax="xyz".indexOf(ch);k=-1;ok=()=>true}
 else if(up=="M"){ax=0;k=1;ok=v=>v==0}else if(up=="E"){ax=1;k=1;ok=v=>v==0}else if(up=="S"){ax=2;k=-1;ok=v=>v==0}
 else{[ax,lay,k]=FACE[up];ok=v=>wide?(v==lay||v==0):v==lay}
 for(const s of S)if(ok(s.p[ax])){s.p=rot(s.p,ax,k*t);s.n=rot(s.n,ax,k*t)}}
function applyAlg(S,alg){alg=String(alg).replace(/([UDLRFB])w/g,(a,b)=>b.toLowerCase());const re=/([UDLRFBudlrfbxyzMES])\s*(2)?\s*(['’′]?)/g;let m;
 while((m=re.exec(alg))){let t=m[2]?2:1;if(m[3])t=-t;move(S,m[1],t)}}
function drawCube(c,S,cx,cy,sc,side,mv){if(mv)S=S.map(s=>{if(!mv.ok(s.p[mv.ax]))return s;const ax=[0,1,2].filter(i=>s.n[i]==0),a=[0,0,0],b=[0,0,0];a[ax[0]]=1;b[ax[1]]=1;return {...s,p:rotC(s.p,mv.ax,mv.ang),n:rotC(s.n,mv.ax,mv.ang),t1:rotC(a,mv.ax,mv.ang),t2:rotC(b,mv.ax,mv.ang)}});
 const th=(side=="R"?-1:1)*35*Math.PI/180,ph=28*Math.PI/180;
 const prj=v=>{const [x,y,z]=v;const x1=x*Math.cos(th)+z*Math.sin(th),z1=-x*Math.sin(th)+z*Math.cos(th);
  return [x1,y*Math.cos(ph)-z1*Math.sin(ph),y*Math.sin(ph)+z1*Math.cos(ph)]};
 const vis=S.filter(s=>prj(s.n)[2]>0.01).sort((a,b)=>prj(a.p)[2]+.5*prj(a.n)[2]-prj(b.p)[2]-.5*prj(b.n)[2]);
 const quad=(s,h)=>{const n=s.n,q=[0,1,2].map(i=>s.p[i]+n[i]*.5);let t1=s.t1,t2=s.t2;if(!t1){const ax=[0,1,2].filter(i=>n[i]==0);t1=[0,0,0];t2=[0,0,0];t1[ax[0]]=1;t2[ax[1]]=1}
  
  return [[1,1],[1,-1],[-1,-1],[-1,1]].map(([a,b])=>{const P=prj(q.map((v,i)=>v+h*(a*t1[i]+b*t2[i])));return [cx+P[0]*sc,cy-P[1]*sc]})};
 c.lineJoin="round";
 for(const s of vis)for(const [h,fill] of [[.5,"#111"],[.43,null]]){const Q=quad(s,h);c.beginPath();Q.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  c.fillStyle=fill||(s.t?"#9aa0a8":COL[s.c]);c.fill();if(fill){c.strokeStyle="#111";c.lineWidth=sc*.06;c.stroke()}}}

/* ---------- OLL / PLL ---------- */
function ollRects(S){const u=S/3.92,g=.06*u,b=.28*u,o=b+.12*u,R=[];
 for(let r=0;r<3;r++)for(let c=0;c<3;c++)R.push([o+c*(u+g),o+r*(u+g),u,u]);
 for(let c=0;c<3;c++)R.push([o+c*(u+g),0,u,b]);
 for(let r=0;r<3;r++)R.push([S-b,o+r*(u+g),b,u]);
 for(let c=0;c<3;c++)R.push([o+c*(u+g),S-b,u,b]);
 for(let r=0;r<3;r++)R.push([0,o+r*(u+g),b,u]);return R}
function drawOLL(c,S,cells){const R=ollRects(S);c.lineJoin="round";c.lineWidth=Math.max(2,S*.008);c.strokeStyle="#222";
 R.forEach((r,i)=>{c.fillStyle=(i==4||cells[i])?"#f7d716":"#eceff1";c.fillRect(...r);c.strokeRect(...r)})}
function pllRects(S){const u=S*.28,g=S*.03,o=(S-3*u-2*g)/2,R=[];for(let r=0;r<3;r++)for(let k=0;k<3;k++)R.push([o+k*(u+g),o+r*(u+g),u,u]);return R}
function drawPLL(c,S,arrows,sl){const R=pllRects(S),u=R[0][2];c.lineJoin="round";c.lineWidth=Math.max(2,S*.008);c.strokeStyle="#222";
 R.forEach((r,i)=>{c.fillStyle=i===sl?"#bcd4ff":"#c9ced6";c.fillRect(...r);c.strokeRect(...r)});
 const ctr=i=>[R[i][0]+u/2,R[i][1]+u/2],H=u*.3,W=S*.022;
 c.fillStyle=c.strokeStyle="#1b1b1f";c.lineCap="round";
 const head=(tx,ty,dx,dy)=>{const bx=tx-dx*H,by=ty-dy*H,px=-dy*H*.5,py=dx*H*.5;c.beginPath();c.moveTo(tx,ty);c.lineTo(bx+px,by+py);c.lineTo(bx-px,by-py);c.closePath();c.fill()};
 for(const a of arrows){const A=ctr(a.a),B=ctr(a.b);let dx=B[0]-A[0],dy=B[1]-A[1];const L=Math.hypot(dx,dy);dx/=L;dy/=L;
  const s0=u*.2,s=[A[0]+dx*s0,A[1]+dy*s0],e=[B[0]-dx*s0,B[1]-dy*s0];
  c.lineWidth=W;c.beginPath();c.moveTo(s[0]+(a.d?dx*H*.8:0),s[1]+(a.d?dy*H*.8:0));c.lineTo(e[0]-dx*H*.8,e[1]-dy*H*.8);c.stroke();
  head(e[0],e[1],dx,dy);if(a.d)head(s[0],s[1],-dx,-dy)}}

/* ---------- card ---------- */
function illus(c,m,S,ed,live){const d=st[m];
 if(m=="f2l"){if(live&&anim)drawCube(c,anim.S,S/2,S/2,S*.215,d.side,anim.mv);else{const C=solved();applyAlg(C,d.setup||"");drawCube(c,C,S/2,S/2,S*.215,d.side)}}
 else if(m=="oll")drawOLL(c,S,d.cells);else drawPLL(c,S,d.arrows,ed?sel:null)}
function fit(c,t,w,fs,wt){while(fs>22){c.font=wt+" "+fs+"px "+FONT;if(c.measureText(t).width<=w)break;fs-=2}}
function wrap(c,t,w){const out=[];for(const para of String(t||"").split("\n")){let line="";for(const word of para.split(/\s+/).filter(Boolean)){const tt=line?line+" "+word:word;if(c.measureText(tt).width>w&&line){out.push(line);line=word}else line=tt}out.push(line)}return out}
function drawCard(c,W,m){const d=st[m];c.fillStyle="#fff";c.fillRect(0,0,W,W);c.strokeStyle="#111";c.lineWidth=8;c.strokeRect(4,4,W-8,W-8);
 c.fillStyle="#111";c.textAlign="center";c.textBaseline="middle";
 const nm=d.name.trim()||"Tên công thức";fit(c,nm,W*.88,64,"700");c.fillText(nm,W/2,92);
 const S=470;c.save();c.translate((W-S)/2,165);illus(c,m,S,false);c.restore();
 const x0=80,w=840,lw=200,rows=[["Setup",d.setup.trim()||"—"],["Giải",d.sol.trim()||"—"]];let fs=46,hs,ls;
 for(;fs>=24;fs-=4){c.font="600 "+fs+"px "+FONT;ls=rows.map(r=>wrap(c,r[1],w-lw-40));hs=ls.map(l=>l.length*fs*1.25+26);if(hs[0]+hs[1]<=250)break}
 let y=668;c.textAlign="left";c.lineWidth=3;c.strokeStyle="#111";
 rows.forEach((r,i)=>{const h=hs[i];c.fillStyle="#eee";c.fillRect(x0,y,lw,h);c.strokeRect(x0,y,lw,h);c.strokeRect(x0+lw,y,w-lw,h);
  c.fillStyle="#111";c.font="700 "+fs+"px "+FONT;c.fillText(r[0],x0+20,y+h/2);
  c.font="600 "+fs+"px "+FONT;const n=ls[i].length;ls[i].forEach((t,k)=>c.fillText(t,x0+lw+20,y+h/2+(k-(n-1)/2)*fs*1.25));y+=h});
 c.textAlign="right";c.font="italic 600 34px "+FONT;c.fillStyle="rgba(0,0,0,.2)";c.fillText("Minh Thanh Cube",W-36,W-34)}

/* ---------- UI ---------- */
const ed=$("ed"),ec=ed.getContext("2d");
function render(){ec.fillStyle="#fff";ec.fillRect(0,0,720,720);illus(ec,mode,720,edit,true);
 if(!$("modal").hidden){const p=$("pv").getContext("2d");drawCard(p,1000,mode)}}
function setHint(){$("hint").textContent=mode=="f2l"?"Khi nhập Setup hoặc Giải, khối sẽ xoay từng tầng để bạn hình dung (có nút ▶ xem lại). Ký hiệu: R U F L D B, x y z, w, ’ hoặc 2.":
 !edit?"Bấm “Chỉnh sửa” để vẽ hình. Setup chỉ để ghi chú, khối không xoay.":
 mode=="oll"?"Chạm vào ô hoặc thanh viền để bật/tắt màu vàng (ô tâm luôn vàng).":
 "Chạm ô đầu rồi ô đích để tạo mũi tên. Chạm ô đầu 2 lần rồi ô đích để có mũi tên 2 đầu. Ấn giữ một ô để xoá đường chạm tới ô đó."}
function setMode(m){stopAnim();mode=m;edit=false;sel=null;dbl=false;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m==m));
 $("rowEdit").hidden=m=="f2l";$("rowSide").hidden=m!="f2l";$("rowPlay").hidden=m!="f2l";$("btnClear").hidden=m=="f2l";
 $("btnEdit").textContent="Chỉnh sửa";ed.classList.remove("editing");
 $("lbSetup").textContent=m=="f2l"?"Setup (khối xoay theo công thức này)":"Setup (chỉ ghi chú, không xoay)";
 const d=st[m];$("name").value=d.name;$("setup").value=d.setup;$("sol").value=d.sol;
 document.querySelectorAll("#rowSide button").forEach(b=>b.classList.toggle("on",b.dataset.s==st.f2l.side));
 setHint();render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{editId=null;setMode(b.dataset.m);hideKb();refreshSaveUI()});
document.querySelectorAll("#rowSide button").forEach(b=>b.onclick=()=>{st.f2l.side=b.dataset.s;document.querySelectorAll("#rowSide button").forEach(x=>x.classList.toggle("on",x==b));render()});
["name","setup","sol"].forEach(k=>$(k).addEventListener("input",e=>{st[mode][k]=e.target.value;render()}));
$("btnEdit").onclick=()=>{edit=!edit;sel=null;dbl=false;$("btnEdit").textContent=edit?"Xong":"Chỉnh sửa";ed.classList.toggle("editing",edit);setHint();render()};
$("btnClear").onclick=()=>{if(mode=="oll"){st.oll.cells.fill(false);st.oll.cells[4]=true}else st.pll.arrows=[];sel=null;dbl=false;render()};

let lpT=null,lp=false;
function hit(e){const r=ed.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*720/r.height;
 const R=mode=="oll"?ollRects(720):pllRects(720);return R.findIndex(q=>x>=q[0]&&x<=q[0]+q[2]&&y>=q[1]&&y<=q[1]+q[3])}
function tap(i){if(mode=="oll"){if(i<9&&i==4)return;if(i!=4)st.oll.cells[i]=!st.oll.cells[i];return}
 if(sel===null){sel=i;dbl=false}else if(i==sel){if(dbl){sel=null;dbl=false}else dbl=true}
 else{st.pll.arrows.push({a:sel,b:i,d:dbl});sel=null;dbl=false}}
ed.addEventListener("pointerdown",e=>{if(!edit||mode=="f2l")return;e.preventDefault();lp=false;const i=hit(e);if(i<0||mode!="pll")return;
 lpT=setTimeout(()=>{lp=true;const a=st.pll.arrows;for(let k=a.length-1;k>=0;k--)if(a[k].a==i||a[k].b==i){a.splice(k,1);break}sel=null;dbl=false;render()},450)});
ed.addEventListener("pointerup",e=>{clearTimeout(lpT);if(!edit||lp||mode=="f2l")return;const i=hit(e);if(i<0)return;tap(i);render()});
["pointerleave","pointercancel"].forEach(t=>ed.addEventListener(t,()=>clearTimeout(lpT)));
ed.addEventListener("contextmenu",e=>e.preventDefault());

async function dl(){const cv=document.createElement("canvas");cv.width=cv.height=1000;drawCard(cv.getContext("2d"),1000,mode);
 const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
 const fn=((st[mode].name.trim()||mode.toUpperCase()).replace(/[^\p{L}\p{N}_-]+/gu,"_"))+".png";
 try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:fn,data:blob});return}}catch(err){if(err&&err.code=="declined")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
$("btnDl").onclick=$("mDl").onclick=dl;
$("btnPrev").onclick=()=>{$("modal").hidden=false;render()};
$("mClose").onclick=()=>{$("modal").hidden=true};

/* ---------- bàn phím riêng ---------- */
const kb=$("kb");let cur=null;
function hideKb(){kb.hidden=true;$("pan").classList.remove("kbOpen");document.body.style.paddingBottom="";cur=null;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
["setup","sol"].forEach(id=>{const i=$(id);i.addEventListener("focus",()=>{cur=i;kb.hidden=false;document.body.style.paddingBottom=kb.offsetHeight+"px";$("pan").classList.add("kbOpen");setTimeout(()=>$("name").closest("label").scrollIntoView({block:"start"}),80)})});
$("name").addEventListener("focus",()=>{kb.hidden=true;$("pan").classList.remove("kbOpen");cur=null;document.body.style.paddingBottom=""});
function kbFire(){cur.dispatchEvent(new Event("input"))}
function kbIns(t){if(!cur)return;const s=cur.selectionStart==null?cur.value.length:cur.selectionStart,e=cur.selectionEnd==null?s:cur.selectionEnd;if(/^[UDRLFBxyzMSE]$/.test(t)&&s>0&&cur.value[s-1]!==" ")t=" "+t;cur.value=cur.value.slice(0,s)+t+cur.value.slice(e);const p=s+t.length;cur.setSelectionRange(p,p);kbFire()}
function kbDel(){if(!cur)return;let s=cur.selectionStart==null?cur.value.length:cur.selectionStart;const e=cur.selectionEnd==null?s:cur.selectionEnd;if(s==e){if(s==0)return;s--}cur.value=cur.value.slice(0,s)+cur.value.slice(e);cur.setSelectionRange(s,s);kbFire()}
kb.addEventListener("pointerdown",e=>e.preventDefault());
kb.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;if(k=="done"){hideKb();return}if(!cur)return;
 if(k=="del")kbDel();else if(k=="clr"){cur.value="";kbFire()}
 else if(k=="paste"){let t="";try{t=await navigator.clipboard.readText()}catch(_){t=prompt("Dán công thức:")||""}if(t)kbIns(t.replace(/\s+/g," "))}
 else kbIns(k)});
document.addEventListener("pointerdown",e=>{if(!kb.hidden&&!e.target.closest("#kb,#setup,#sol"))hideKb()});

/* ---------- lưu local ---------- */
const LK="iconrubik.lib";
function libGet(){try{return JSON.parse(localStorage.getItem(LK))||[]}catch(e){return []}}
const LK2='iconrubik.lib2',el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let LIB={items:[],folders:[]},editId=null,listMode='f2l',anim=null,animTok=0,animT=null;

/* ---------- chuyển động từng tầng ---------- */
function spec(ch){const up=ch.toUpperCase(),wide=ch!==up&&'UDLRFB'.includes(up);let ax,lay,k,ok;
 if('xyz'.includes(ch)){ax='xyz'.indexOf(ch);k=-1;ok=()=>true}else if(up=='M'){ax=0;k=1;ok=v=>v==0}else if(up=='E'){ax=1;k=1;ok=v=>v==0}else if(up=='S'){ax=2;k=-1;ok=v=>v==0}
 else{[ax,lay,k]=FACE[up];ok=v=>wide?(v==lay||v==0):v==lay}
 return {ax:ax,k:k,ok:ok}}
function parseAlg(alg){alg=String(alg).replace(/([UDLRFB])w/g,(a,b)=>b.toLowerCase());const re=/([UDLRFBudlrfbxyzMES])\s*(2)?\s*(['’′]?)/g,L=[];let m;while((m=re.exec(alg))){let t=m[2]?2:1;if(m[3])t=-t;L.push([m[1],t])}return L}
function rotC(v,a,th){const c=Math.cos(th),s=Math.sin(th),x=v[0],y=v[1],z=v[2];
 if(a==0)return [x,y*c-z*s,y*s+z*c];if(a==1)return [x*c+z*s,y,-x*s+z*c];return [x*c-y*s,x*s+y*c,z]}
function stopAnim(){animTok++;anim=null}
function play(S0,alg){const tok=++animTok,L=parseAlg(alg);if(!L.length){anim=null;render();return}
 const S=S0.map(s=>({...s,p:s.p.slice(),n:s.n.slice()}));let i=0;
 const step=()=>{if(tok!==animTok)return;
  if(i>=L.length){anim={S:S,mv:null};render();setTimeout(()=>{if(tok==animTok){anim=null;render()}},700);return}
  const ch=L[i][0],t=L[i][1];i++;const sp=spec(ch),th=Math.PI/2*sp.k*t,dur=Math.abs(t)>1?460:300,t0=performance.now();
  const fr=now=>{if(tok!==animTok)return;const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
   anim={S:S,mv:{ax:sp.ax,ok:sp.ok,ang:th*e}};render();
   if(p<1)requestAnimationFrame(fr);else{move(S,ch,t);anim={S:S,mv:null};render();step()}};
  requestAnimationFrame(fr)};
 anim={S:S,mv:null};render();step()}
function setupState(){const C=solved();applyAlg(C,st.f2l.setup||'');return C}
function runAnim(k){if(mode!='f2l')return;if(k=='setup')play(solved(),st.f2l.setup);else play(setupState(),st.f2l.sol)}
$('bpSetup').onclick=()=>{stopAnim();runAnim('setup')};
$('bpSol').onclick=()=>{stopAnim();runAnim('sol')};
['setup','sol'].forEach(k=>$(k).addEventListener('input',()=>{if(mode!='f2l')return;clearTimeout(animT);stopAnim();render();animT=setTimeout(()=>runAnim(k),500)}));

/* ---------- danh sách công thức ---------- */
function loadLib(){try{const j=JSON.parse(localStorage.getItem(LK2));if(j&&j.items){LIB=j;if(!LIB.folders)LIB.folders=[];return}}catch(e){}
 LIB={items:libGet().map(o=>({id:o.id,mode:o.mode,folder:null,data:o.data})),folders:[]}}
function saveLib(){try{localStorage.setItem(LK2,JSON.stringify(LIB));return true}catch(e){return false}}
function refreshSaveUI(){const s=$('saveFolder'),cur=s.value;s.innerHTML='';s.add(new Option('Lưu vào: chưa phân mục',''));
 folderOpts(mode).forEach(o=>s.add(new Option('Lưu vào mục: '+o.l,o.id)));
 const it=editId&&LIB.items.find(x=>x.id==editId&&x.mode==mode);
 s.value=it?(it.folder||''):cur;if(s.selectedIndex<0)s.selectedIndex=0;
 $('btnSave').textContent=it?'Cập nhật':'Lưu vào danh sách';$('btnSaveNew').hidden=!it}
function doSave(asNew){const d=JSON.parse(JSON.stringify(st[mode])),f=$('saveFolder').value||null;
 const it=(!asNew&&editId)?LIB.items.find(x=>x.id==editId):null;
 if(it){it.data=d;it.folder=f;it.mode=mode}else{const n={id:uid(),mode:mode,folder:f,data:d};LIB.items.push(n);editId=n.id}
 $('hint').textContent=saveLib()?(it?'Đã cập nhật công thức.':'Đã lưu vào danh sách.'):'Không lưu được (trình duyệt chặn bộ nhớ).';refreshSaveUI()}
function blank(m){return m=='f2l'?{name:'',setup:'',sol:'',side:st.f2l.side}:m=='oll'?{name:'',setup:'',sol:'',cells:Array.from({length:21},(_,i)=>i==4)}:{name:'',setup:'',sol:'',arrows:[]}}
$('btnSave').onclick=()=>doSave(false);
$('btnSaveNew').onclick=()=>doSave(true);
$('btnNew').onclick=()=>{stopAnim();st[mode]=blank(mode);editId=null;setMode(mode);refreshSaveUI()};
function armDel(b,fn){let a=false,t;b.onclick=()=>{if(a){clearTimeout(t);fn();return}a=true;const o=b.textContent;b.textContent='Chắc chắn?';t=setTimeout(()=>{a=false;b.textContent=o},2500)}}
function itemEl(i){const d=el('div','it'),t=el('div'),nb=el('b'),sm=el('small');nb.textContent=i.data.name||'(không tên)';sm.textContent=(i.data.sol||'').trim();t.append(nb,sm);
 const r=el('div','r'),eb=el('button'),sel=el('select'),del=el('button','del');
 eb.textContent='Sửa';eb.onclick=()=>{st[i.mode]=JSON.parse(JSON.stringify(i.data));$('lm').hidden=true;setMode(i.mode);editId=i.id;refreshSaveUI()};
 fillSel(sel,i.mode);sel.value=i.folder||'';if(sel.selectedIndex<0)sel.selectedIndex=0;
 sel.onchange=()=>{i.folder=sel.value||null;saveLib();renderList()};
 del.textContent='Xoá';armDel(del,()=>{LIB.items=LIB.items.filter(x=>x!==i);if(editId==i.id)editId=null;saveLib();renderList();refreshSaveUI()});
 r.append(eb,sel,del);d.append(t,r);return d}
let listCur=null;
function fPath(id){const a=[];let f=LIB.folders.find(x=>x.id==id),g=0;while(f&&g++<200){a.unshift(f);const p=f.parent;f=LIB.folders.find(x=>x.id==p)}return a}
function fLabel(id){return fPath(id).map(f=>f.name).join(' › ')}
function folderOpts(m){return LIB.folders.filter(f=>f.mode==m).map(f=>({id:f.id,l:fLabel(f.id)})).sort((a,b)=>a.l.localeCompare(b.l))}
function fillSel(sel,m){sel.add(new Option('Chưa phân mục',''));folderOpts(m).forEach(o=>sel.add(new Option(o.l,o.id)))}
function renderList(){const b=$('lbody');b.innerHTML='';const m=listMode;
 document.querySelectorAll('#ltabs button').forEach(x=>x.classList.toggle('on',x.dataset.m==m));
 if(listCur&&!LIB.folders.some(f=>f.id==listCur&&f.mode==m))listCur=null;
 const cur=listCur?LIB.folders.find(f=>f.id==listCur):null;
 const nav=el('div','fh');
 if(cur){const up=el('button');up.textContent='← Thoát';up.onclick=()=>{listCur=cur.parent||null;renderList()};nav.append(up)}
 const path=el('div','lh');path.style.flex='1';path.textContent=[m.toUpperCase()].concat(fPath(listCur).map(f=>f.name)).join(' › ');nav.append(path);b.appendChild(nav);
 if(cur){const h=el('div','fh'),inp=el('input'),del=el('button');inp.value=cur.name;
  inp.onchange=()=>{cur.name=inp.value.trim()||cur.name;inp.value=cur.name;saveLib();refreshSaveUI();renderList()};
  del.textContent='Xoá mục';armDel(del,()=>{const p=cur.parent||null;LIB.folders.forEach(f=>{if(f.parent==cur.id)f.parent=p});LIB.items.forEach(i=>{if(i.folder==cur.id)i.folder=p});LIB.folders=LIB.folders.filter(x=>x!==cur);listCur=p;saveLib();renderList();refreshSaveUI()});
  h.append(inp,del);b.appendChild(h)}
 const subs=LIB.folders.filter(f=>f.mode==m&&(f.parent||null)==listCur);
 subs.forEach(f=>{const r=el('button'),n=LIB.folders.filter(x=>x.parent==f.id).length+LIB.items.filter(i=>i.folder==f.id).length;
  r.style.textAlign='left';r.style.fontWeight='600';r.textContent='📁 '+f.name+'  ('+n+')';r.onclick=()=>{listCur=f.id;renderList()};b.appendChild(r)});
 const list=LIB.items.filter(i=>i.mode==m&&(i.folder||null)==listCur);
 list.forEach(i=>b.appendChild(itemEl(i)));
 if(!subs.length&&!list.length){const e=el('div','lh');e.textContent='(trống)';b.appendChild(e)}}
document.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>{listMode=b.dataset.m;listCur=null;renderList()});
$('btnList').onclick=()=>{listMode=mode;listCur=null;$('lm').hidden=false;renderList()};
$('lClose').onclick=()=>{$('lm').hidden=true};

/* ---------- tải tất cả (zip) ---------- */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return (c^-1)>>>0}
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,f.data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz}
 let cs=0;cd.forEach(p=>{cs+=p.length});const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function saveFile(fn,blob){try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:fn,data:blob});return}}catch(err){if(err&&err.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
$('lAll').onclick=async()=>{const b=$('lAll'),o=b.textContent;
 if(!LIB.items.length){b.textContent='Danh sách trống';setTimeout(()=>{b.textContent=o},1500);return}
 b.disabled=true;b.textContent='Đang tạo…';
 try{const files=[],used={};
  for(const it of LIB.items){
   const base=[it.mode.toUpperCase(),...fPath(it.folder).map(f=>f.name),it.data.name||'khong-ten'].filter(Boolean).map(s=>s.replace(/[\\/:*?"<>|]+/g,'_').trim()||'_');
   let nm=base.join('/'),k=1;while(used[nm]){k++;nm=base.join('/')+'_'+k}used[nm]=1;
   const cv=document.createElement('canvas');cv.width=cv.height=1000;const old=st[it.mode];st[it.mode]=it.data;
   try{drawCard(cv.getContext('2d'),1000,it.mode)}finally{st[it.mode]=old}
   const bl=await new Promise(r=>cv.toBlob(r,'image/png'));files.push({name:nm+'.png',data:new Uint8Array(await bl.arrayBuffer())})}
  await saveFile('Minh-Thanh-Cube-IRubik.zip',makeZip(files))}catch(e){}
 b.disabled=false;b.textContent=o};
$('fAdd').onclick=()=>{const n=$('fname').value.trim();if(!n)return;LIB.folders.push({id:uid(),mode:listMode,name:n,parent:listCur});$('fname').value='';saveLib();renderList();refreshSaveUI()};

document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});

loadLib();setMode("f2l");refreshSaveUI();
