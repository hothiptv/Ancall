<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlViewer - Đọc Nội Dung Biến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #161b22;
            --card-bg: #1f242d;
            --border-color: #2e3440;
            --accent-color: #2563eb;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .viewer-container {
            max-width: 950px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            gap: 12px;
        }

        .viewer-header {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .viewer-card {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-height: 0;
        }

        .viewer-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #38bdf8;
            box-sizing: border-box;
        }

        .back-btn {
            background-color: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .url-badge {
            font-size: 12px;
            color: var(--text-sub);
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .viewer-container { padding: 6px; }
            .url-badge { display: none; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="viewer-container">
    <div class="viewer-header">
        <div class="d-flex align-items-center gap-2">
            <h5 class="m-0 fw-bold text-light"><i class="bi bi-file-earmark-code"></i> AlViewer</h5>
            <span class="url-badge" id="sourceUrlDisplay">Đang tải cấu hình biến...</span>
        </div>
        <a href="alchat.html" class="back-btn">
            <i class="bi bi-arrow-left"></i> Quay về AlChat
        </a>
    </div>

    <div class="viewer-card">
        <div id="loadingBox" class="text-center py-5 text-secondary my-auto">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div> Đang tải nội dung file...
        </div>
        <div id="errorBox" class="alert alert-danger m-3 d-none"></div>
        <pre id="contentBox" class="viewer-body d-none"></pre>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAnsLAxCi_1RiYZ7kwwzNi7subRrvTI04I",
      authDomain: "dataan-d19b7.firebaseapp.com",
      databaseURL: "https://dataan-d19b7-default-rtdb.firebaseio.com",
      projectId: "dataan-d19b7",
      storageBucket: "dataan-d19b7.firebasestorage.app",
      messagingSenderId: "634110626824",
      appId: "1:634110626824:web:903a5181db232369f495bd",
      measurementId: "G-1LK1W3FPG3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", (e) => {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const varName = urlParams.get('v');
    const directUrl = urlParams.get('url');

    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const contentBox = document.getElementById('contentBox');
    const sourceUrlDisplay = document.getElementById('sourceUrlDisplay');

    // Hàm giải mã base64 hỗ trợ tiếng Việt chuẩn
    function decodeBase64Unicode(base64Str) {
        const binString = atob(base64Str.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
    }

    // Hàm lấy nội dung tối ưu cho môi trường Localhost và điện thoại
    async function fetchGitHubContent(targetUrl) {
        let fetchUrl = targetUrl;

        // Chuyển link raw.githubusercontent.com sang GitHub API chính thức (vượt qua mọi giới hạn localhost và CORS)
        if (targetUrl.includes("raw.githubusercontent.com")) {
            const parts = targetUrl.replace("https://raw.githubusercontent.com/", "").split("/");
            if (parts.length >= 4) {
                const owner = parts[0];
                const repo = parts[1];
                const branch = parts[2];
                const filePath = parts.slice(3).join("/");
                fetchUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}?ref=${branch}`;
            }
        }

        try {
            // Thử gọi trực tiếp GitHub API trước
            const res = await fetch(fetchUrl, { headers: { "Accept": "application/vnd.github+json" } });
            if (res.ok) {
                const data = await res.json();
                if (data && data.content && data.encoding === "base64") {
                    return decodeBase64Unicode(data.content);
                }
            }
        } catch (e) {
            console.warn("Gọi API trực tiếp lỗi, chuyển sang cơ chế dự phòng...");
        }

        // Dự phòng qua dịch vụ CDN/CORS công khai nếu API trực tiếp gặp vấn đề mạng
        const fallbackRes = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`);
        if (fallbackRes.ok) {
            return await fallbackRes.text();
        }

        throw new Error("Không thể tải file. Hãy chắc chắn Repository chứa file đang ở chế độ Public.");
    }

    async function initViewer() {
        if (!varName && !directUrl) {
            loadingBox.classList.add('d-none');
            errorBox.innerText = "Lỗi: Không tìm thấy tham số biến (v) hoặc liên kết (url) trên URL.";
            errorBox.classList.remove('d-none');
            sourceUrlDisplay.innerText = "Thiếu tham số";
            return;
        }

        let targetUrl = directUrl;

        try {
            if (varName) {
                sourceUrlDisplay.innerText = `Đang tra cứu biến: v.${varName}`;
                const docRef = doc(db, "alchat_settings", "config");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const linksMap = data.viewerLinks || {};
                    if (linksMap[varName]) {
                        targetUrl = linksMap[varName];
                    } else {
                        throw new Error(`Không tìm thấy biến cấu hình có tên là "${varName}" trong cơ sở dữ liệu!`);
                    }
                } else {
                    throw new Error("Không tìm thấy cấu hình trên Firestore!");
                }
            }

            sourceUrlDisplay.innerText = targetUrl;

            const textData = await fetchGitHubContent(targetUrl);

            loadingBox.classList.add('d-none');
            contentBox.innerText = textData;
            contentBox.classList.remove('d-none');

        } catch (err) {
            loadingBox.classList.add('d-none');
            errorBox.innerText = "Lỗi tải nội dung: " + err.message;
            errorBox.classList.remove('d-none');
        }
    }

    initViewer();
</script>
</body>
</html>
