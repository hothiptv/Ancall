<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altide html PRO - TV Edition</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-sidebar: #0d1222;
            --bg-active: #1f294d;
            --text-color: #c0caf5;
            --accent: #00f0ff;
            --accent-purple: #9d4edd;
            --syntax-tag: #f7768e;
            --syntax-attr: #73daca;
            --syntax-str: #e0af68;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-color); overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }

        /* TOPBAR HỆ THỐNG */
        .topbar {
            height: 60px; background: var(--bg-sidebar); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #1a2342; z-index: 10;
        }
        .topbar-left { display: flex; align-items: center; gap: 15px; }
        .menu-icon { font-size: 24px; cursor: pointer; color: var(--text-color); padding: 5px 10px; border-radius: 4px; }
        .topbar h1 { font-size: 1.5rem; text-shadow: 0 0 8px var(--accent); color: #fff; }
        .btn-save { 
            background: linear-gradient(45deg, var(--accent), var(--accent-purple)); color: white; 
            border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }

        /* KHÔNG GIAN CHIA ĐÔI MÀN HÌNH CỐ ĐỊNH */
        .main-container { flex: 1; display: flex; width: 100vw; overflow: hidden; position: relative; }
        
        /* Bên trái: Khung nhập code */
        .editor-pane { width: 50%; height: 100%; display: flex; flex-direction: column; background: #020408; position: relative; border-right: 2px solid #1f294d; }
        .textarea-wrapper { position: relative; flex: 1; width: 100%; overflow: hidden; }
        
        textarea.code-input, .backdrop-highlight {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            font-family: 'Consolas', 'Courier New', monospace; font-size: 18px; /* Tăng size chữ cho dễ nhìn trên TV */
            line-height: 1.6; padding: 20px; box-sizing: border-box;
            white-space: pre-wrap;       
            word-wrap: break-word;       
            overflow-y: auto; overflow-x: hidden;
        }
        textarea.code-input { background: transparent; color: transparent; caret-color: #00f0ff; border: none; resize: none; z-index: 2; }
        textarea.code-input:focus { outline: none; }
        .backdrop-highlight { z-index: 1; color: #a9b1d6; pointer-events: none; background: #04060a; }

        /* Bên phải: Màn hình chạy code */
        .preview-pane { width: 50%; height: 100%; background: white; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        /* THANH PHÍM TẮT DƯỚI KHUNG NHẬP CODE (Tự đẩy lên theo bàn phím TV) */
        .tv-shortcut-bar { 
            background: #0d1222; display: flex; padding: 10px; overflow-x: auto; 
            white-space: nowrap; border-top: 1px solid #1f294d; gap: 8px; width: 100%; z-index: 5;
        }
        /* Ẩn thanh cuộn xấu xí nhưng vẫn cho vuốt/cuộn ngang bằng remote */
        .tv-shortcut-bar::-webkit-scrollbar { height: 0px; background: transparent; }
        
        .tv-key { 
            display: inline-block; background: #161b30; color: white; padding: 10px 18px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; border: 1px solid #252e54;
            flex-shrink: 0; transition: 0.1s;
        }

        /* HIGHLIGHT MÀU SẮC CYBERPUNK */
        .hl-tag { color: var(--syntax-tag); font-weight: bold; text-shadow: 0 0 5px rgba(247, 118, 142, 0.4); }
        .hl-attr { color: var(--syntax-attr); }
        .hl-str { color: var(--syntax-str); }

        /* 🔥 HIỆU ỨNG VIỀN SÁNG TẬP TRUNG CHO REMOTE TV */
        .tv-focusable:focus, .tv-focused { 
            outline: 3px solid var(--accent) !important; 
            box-shadow: 0 0 15px var(--accent) !important;
            background: var(--bg-active) !important;
            color: #fff !important;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <div class="menu-icon tv-focusable" tabindex="0" onclick="alert('Menu Hệ thống đang phát triển')">☰</div>
            <h1>Altide html PRO <span style="font-size: 12px; color: var(--accent);">[TV EDITION]</span></h1>
        </div>
        <button class="btn-save tv-focusable" tabindex="0" onclick="saveCodeToStorage()">Lưu cấu trúc 💾</button>
    </div>

    <div class="main-container">
        
        <div class="editor-pane">
            <div class="textarea-wrapper">
                <div class="backdrop-highlight" id="highlight-view"></div>
                <textarea class="code-input tv-focusable" id="code-textarea" tabindex="0" spellcheck="false" onfocus="clearPlaceholderOnce()" oninput="onCodeInput()" onscroll="syncScroll()" onkeydown="onCodeKeyDown(event)"></textarea>
            </div>
            
            <div class="tv-shortcut-bar" id="shortcut-scroll-container">
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('<')">&lt;</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('>')">&gt;</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('/')">/</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut(':')">:</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut(';')">;</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('(')">(</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut(')')">)</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('=')">=</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('{')">{</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('}')">}</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('[')">[</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut(']')">]</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('#')">#</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('-')">-</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('_')">_</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('.')">.</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('1')">1</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('2')">2</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('3')">3</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('4')">4</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('5')">5</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('6')">6</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('7')">7</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('8')">8</div>
                <div class="tv-key tv-focusable" tabindex="0" onclick="insertShortcut('9')">9</div>
            </div>
        </div>

        <div class="preview-pane">
            <iframe id="live-frame"></iframe> 
        </div>
    </div>

    <script>
        let isFirstClick = true; 
        
        // Khởi tạo và nạp dữ liệu biến lưu trữ sẵn (Không mất dữ liệu khi F5)
        let savedCode = localStorage.getItem('altide_tv_code') || `<!DOCTYPE html>\n<html>\n<head>\n  <title>TV App</title>\n</head>\n<body>\n  <h1>Chào bro Nguyễn Trọng An!</h1>\n  <p>Dùng Remote TV điều hướng viền sáng cực phê.</p>\n</body>\n</html>`;

        window.onload = function() {
            const txt = document.getElementById('code-textarea');
            txt.value = savedCode;
            onCodeInput();
            updatePreview();
            setupTVRemoteNavigation();
        };

        function clearPlaceholderOnce() {
            const txt = document.getElementById('code-textarea');
            if (isFirstClick && txt.value.includes("Chào bro Nguyễn Trọng An")) {
                txt.value = '';
                isFirstClick = false;
                onCodeInput();
            }
        }

        function saveCodeToStorage() {
            const txt = document.getElementById('code-textarea').value;
            localStorage.setItem('altide_tv_code', txt);
            updatePreview();
            alert("Đã lưu biến cấu trúc thành công vào TV! 🚀");
        }

        function updatePreview() {
            const iframe = document.getElementById('live-frame');
            const code = document.getElementById('code-textarea').value;
            if(!iframe) return;
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        function syncScroll() {
            const txt = document.getElementById('code-textarea');
            const highlightView = document.getElementById('highlight-view');
            highlightView.scrollTop = txt.scrollTop;
            highlightView.scrollLeft = txt.scrollLeft;
        }

        function onCodeInput() {
            const txt = document.getElementById('code-textarea');
            const highlightView = document.getElementById('highlight-view');
            syncScroll();

            let htmlText = txt.value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            htmlText = htmlText.replace(/(&lt;\/?[a-zA-Z1-6!][^&]*?&gt;)/g, '<span class="hl-tag">$1</span>');
            htmlText = htmlText.replace(/(\s[a-zA-Z0-9-]+)=/g, '<span class="hl-attr">$1</span>=');
            htmlText = htmlText.replace(/(&quot;.*?&quot;|'.*?')/g, '<span class="hl-str">$1</span>');

            highlightView.innerHTML = htmlText;
            
            // Tự động render live sang màn hình chạy bên phải khi gõ chữ
            updatePreview();
        }

        function onCodeKeyDown(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                insertShortcut('  ');
            }
        }

        function insertShortcut(text) {
            const txt = document.getElementById('code-textarea');
            const start = txt.selectionStart;
            const end = txt.selectionEnd;
            txt.value = txt.value.substring(0, start) + text + txt.value.substring(end);
            txt.selectionStart = txt.selectionEnd = start + text.length;
            onCodeInput();
            txt.focus();
        }

        // --- 📺 ENGINE ĐIỀU HƯỚNG VIỀN SÁNG BẰNG REMOTE TV CHUẨN ĐÉT ---
        let tvElements = [];
        let tvFocusIndex = 0;

        function setupTVRemoteNavigation() {
            // Lấy danh sách các phần tử có khả năng Focus ban đầu
            updateFocusableElements();
            if(tvElements.length > 0) {
                focusTVElement();
            }

            window.addEventListener('keydown', function(e) {
                updateFocusableElements();
                if(tvElements.length === 0) return;

                // Nếu đang gõ text mà không phải phím điều hướng hệ thống thì giữ nguyên tiêu điểm trong ô nhập
                if (document.activeElement === document.getElementById('code-textarea') && 
                    !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Escape'].includes(e.key)) {
                    return; 
                }

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    tvFocusIndex = (tvFocusIndex + 1) % tvElements.length;
                    focusTVElement();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    tvFocusIndex = (tvFocusIndex - 1 + tvElements.length) % tvElements.length;
                    focusTVElement();
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    // Tìm kiếm phần tử gần nhất ở phía dưới (Logic nhảy dòng thông minh cho TV)
                    jumpToNearestDirection('down');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    jumpToNearestDirection('up');
                } else if (e.key === 'Enter') {
                    // Nếu không phải đang trong vùng soạn thảo của Textarea thì mô phỏng cú click
                    if(document.activeElement !== document.getElementById('code-textarea')) {
                        e.preventDefault();
                        if(tvElements[tvFocusIndex]) {
                            tvElements[tvFocusIndex].click();
                        }
                    }
                }
            });
        }

        function updateFocusableElements() {
            tvElements = Array.from(document.querySelectorAll('.tv-focusable'));
            // Chỉ tính các phần tử đang hiện hình trên màn hình
            tvElements = tvElements.filter(el => el.getBoundingClientRect().width > 0);
        }

        function focusTVElement() {
            tvElements.forEach(el => el.classList.remove('tv-focused'));
            const target = tvElements[tvFocusIndex];
            if(target) {
                target.focus();
                target.classList.add('tv-focused');
                
                // 🔥 TỰ ĐỘNG CUỘN: Nếu nút phím tắt bị tràn màn hình, TV tự động cuộn nút đó vào tầm nhìn
                if(target.classList.contains('tv-key')) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }
            }
        }

        // Thuật toán tìm kiếm phần tử gần nhất theo tọa độ hình học (Dành cho Lên / Xuống)
        function jumpToNearestDirection(dir) {
            const currentRect = tvElements[tvFocusIndex].getBoundingClientRect();
            let bestIndex = tvFocusIndex;
            let minDistance = Infinity;

            tvElements.forEach((el, idx) => {
                if (idx === tvFocusIndex) return;
                const rect = el.getBoundingClientRect();
                
                let isValid = false;
                if (dir === 'down' && rect.top >= currentRect.bottom - 5) isValid = true;
                if (dir === 'up' && rect.bottom <= currentRect.top + 5) isValid = true;

                if (isValid) {
                    // Tính khoảng cách Euclid giữa tâm 2 phần tử
                    const distX = (rect.left + rect.width/2) - (currentRect.left + currentRect.width/2);
                    const distY = (rect.top + rect.height/2) - (currentRect.top + currentRect.height/2);
                    const distance = Math.sqrt(distX * distX + distY * distY);

                    if (distance < minDistance) {
                        minDistance = distance;
                        bestIndex = idx;
                    }
                }
            });

            if (bestIndex !== tvFocusIndex) {
                tvFocusIndex = bestIndex;
                focusTVElement();
            }
        }
    </script>
</body>
</html>
