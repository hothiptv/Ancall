<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Web App</title>

  <!-- Đánh dấu cho iOS biết đây là Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="App Của An">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 20px;
      /* Xử lý khoảng trống tránh đè lên Tai thỏ / Dynamic Island / Thanh Home */
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 350px;
      width: 100%;
    }

    /* Đổi giao diện khi chạy dạng App */
    .app-mode h1 {
      font-size: 2.5rem;
      color: #007aff;
    }

    .icon-share {
      display: inline-block;
      vertical-align: middle;
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Giao diện hiển thị trên trình duyệt Safari bình thường -->
    <div id="browser-view">
      <h2 style="margin-bottom: 12px;">Cài đặt ứng dụng</h2>
      <p style="color: #6e6e73; line-height: 1.5;">
        Hãy nhấn vào nút <strong>Chia sẻ</strong> 
        <svg class="icon-share" fill="#007aff" viewBox="0 0 24 24"><path d="M16 5l-1.42 1.42-1.59-1.59V16h-2V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.11 0-2-.9-2-2V10c0-1.1.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .9 2 2z"/></svg> 
        trên Safari, sau đó chọn <strong>"Thêm vào Màn hình chính"</strong> để trải nghiệm tốt nhất!
      </p>
    </div>

    <!-- Giao diện hiển thị khi đã mở bằng App ngoài màn hình chính -->
    <div id="app-view" class="app-mode" style="display: none;">
      <h1>Xin chào! 👋</h1>
      <p style="margin-top: 10px; color: #86868b;">Bạn đang chạy trang web này dưới dạng App.</p>
    </div>
  </div>

  <script>
    // Kiểm tra xem web có đang chạy ở chế độ standalone (App ngoài màn hình chính) hay không
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    if (isStandalone) {
      // Nếu là App: Ẩn thông báo trình duyệt, hiện dòng chữ "Xin chào"
      document.getElementById('browser-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
    }
  </script>

</body>
</html>
