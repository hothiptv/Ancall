<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alline Admin Panel - Quản lý Nền</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-center">Quản lý Thư viện nền Alline</h2>
    
    <!-- Form Thêm/Sửa -->
    <div class="card p-4 shadow-sm mb-5">
        <h5 id="form-title">Thêm nền mới</h5>
        <div class="row g-3">
            <input type="hidden" id="edit-key">
            <div class="col-md-3"><input type="text" id="bg-class" class="form-control" placeholder="Class (Mã nền)"></div>
            <div class="col-md-3"><input type="text" id="bg-name" class="form-control" placeholder="Tên nền"></div>
            <div class="col-md-3"><input type="text" id="bg-author" class="form-control" placeholder="Tác giả"></div>
            <div class="col-md-3"><input type="text" id="bg-version" class="form-control" placeholder="Version"></div>
            <div class="col-12"><input type="text" id="bg-url" class="form-control" placeholder="Link ảnh nền (URL)"></div>
            <div class="col-12">
                <button onclick="saveData()" class="btn btn-primary" id="btn-save">Lưu dữ liệu</button>
                <button onclick="resetForm()" class="btn btn-secondary">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Bảng danh sách -->
    <div class="card shadow-sm">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Class</th>
                    <th>Tên nền</th>
                    <th>Tác giả</th>
                    <th>Version</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="bg-table-body">
                <!-- Data từ Firebase sẽ load vào đây -->
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnsLAxCi_1RiYZ7kwwzNi7subRrvTI04I",
        authDomain: "dataan-d19b7.firebaseapp.com",
        databaseURL: "https://dataan-d19b7-default-rtdb.firebaseio.com",
        projectId: "dataan-d19b7",
        storageBucket: "dataan-d19b7.firebasestorage.app",
        messagingSenderId: "634110626824",
        appId: "1:634110626824:web:903a5181db232369f495bd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'backgrounds');

    window.saveData = () => {
        const key = document.getElementById('edit-key').value;
        const bgClass = document.getElementById('bg-class').value;
        const data = {
            bgName: document.getElementById('bg-name').value,
            bgAuthor: document.getElementById('bg-author').value,
            bgVersion: document.getElementById('bg-version').value,
            bgUrl: document.getElementById('bg-url').value
        };

        if(key) {
            update(ref(db, 'backgrounds/' + key), data);
        } else {
            set(ref(db, 'backgrounds/' + bgClass), data);
        }
        resetForm();
    };

    window.editData = (key, data) => {
        document.getElementById('edit-key').value = key;
        document.getElementById('bg-class').value = key;
        document.getElementById('bg-name').value = data.bgName;
        document.getElementById('bg-author').value = data.bgAuthor;
        document.getElementById('bg-version').value = data.bgVersion;
        document.getElementById('bg-url').value = data.bgUrl;
        document.getElementById('form-title').innerText = "Sửa nền: " + key;
    };

    window.deleteData = (key) => {
        if(confirm("Xóa nền này?")) remove(ref(db, 'backgrounds/' + key));
    };

    window.resetForm = () => {
        document.getElementById('edit-key').value = "";
        document.getElementById('bg-class').value = "";
        document.getElementById('bg-name').value = "";
        document.getElementById('bg-author').value = "";
        document.getElementById('bg-version').value = "";
        document.getElementById('bg-url').value = "";
        document.getElementById('form-title').innerText = "Thêm nền mới";
    };

    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('bg-table-body');
        tbody.innerHTML = "";
        if(data) {
            Object.keys(data).forEach(key => {
                tbody.innerHTML += `<tr>
                    <td>${key}</td>
                    <td>${data[key].bgName}</td>
                    <td>${data[key].bgAuthor}</td>
                    <td>${data[key].bgVersion}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick='editData("${key}", ${JSON.stringify(data[key])})'>Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick='deleteData("${key}")'>Xóa</button>
                    </td>
                </tr>`;
            });
        }
    });
</script>
</body>
</html>
